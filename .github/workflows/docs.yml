name: Docs

on:
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "Makefile"
      - "properdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      # The layout figures are generated from these, so a change here changes the site.
      - "tools/bookpile_geometry.py"
      - "tools/render_layout_icons.py"
      - "tools/render_layout_shapes.py"
      - "tools/render_transform_diagram.py"
      - "mod/src/Storage/BookPileLayoutIcons.cs"
      - "mod/assets/liberterra/config/bookpile-layout.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "Makefile"
      - "properdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      # The layout figures are generated from these, so a change here changes the site.
      - "tools/bookpile_geometry.py"
      - "tools/render_layout_icons.py"
      - "tools/render_layout_shapes.py"
      - "tools/render_transform_diagram.py"
      - "mod/src/Storage/BookPileLayoutIcons.cs"
      - "mod/assets/liberterra/config/bookpile-layout.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Sync Python deps
        run: uv sync --frozen

      - name: Build docs
        run: make docs-build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy docs
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
